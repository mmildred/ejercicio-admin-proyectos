spring.application.name=Ejercicio5MyAPIGestor
server.port=8081

# Configuracion parametrizable de base de datos para despliegue seguro
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dbgestor}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Rosa2610*}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configuracion JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDB103Dialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
