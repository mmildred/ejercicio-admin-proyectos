spring.application.name=Ejercicio5MyAPIGestor
server.port=${PORT:8081}

# Configuracion de base de datos compatible con Railway, Docker y entorno local
spring.datasource.url=${SPRING_DATASOURCE_URL:${MYSQL_URL:jdbc:mariadb://${DB_HOST:${MYSQLHOST:localhost}}:${DB_PORT:${MYSQLPORT:3306}}/${DB_NAME:${MYSQLDATABASE:dbgestor}}}}
spring.datasource.username=${DB_USER:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:Rosa2610*}}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configuracion JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDB103Dialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
