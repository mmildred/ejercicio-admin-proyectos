spring.application.name=Ejercicio5MyAPIGestor
server.port=${PORT:8081}

# ==========================================
# Configuración de Base de Datos
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:${MYSQL_URL:jdbc:mariadb://${DB_HOST:${MYSQLHOST:localhost}}:${DB_PORT:${MYSQLPORT:3306}}/${DB_NAME:${MYSQLDATABASE:dbgestor}}}}
spring.datasource.username=${DB_USER:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:Rosa2610*}}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ==========================================
# Configuración de HikariCP (Pool de Conexiones)
# ==========================================
# Tiempo máximo de vida de una conexión (9 minutos = 540000 ms)
# IMPORTANTE: Debe ser menor al 'wait_timeout' de MariaDB (usualmente 600s)
spring.datasource.hikari.max-lifetime=540000

# Tiempo máximo de inactividad antes de cerrar una conexión (5 minutos)
spring.datasource.hikari.idle-timeout=300000

# Prueba que la conexión esté viva antes de entregarla a la aplicación
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.test-while-idle=true

# Mantiene vivas las conexiones activas enviando un "ping" (2 minutos)
spring.datasource.hikari.keepalive-time=120000

# ==========================================
# Configuración JPA / Hibernate
# ==========================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDB103Dialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update