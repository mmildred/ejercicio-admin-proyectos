spring.application.name=Ejercicio5MyAPIGestor
server.port=${PORT:8081}

# ==========================================
# Configuración de Base de Datos
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://${DB_HOST:${MYSQLHOST:localhost}}:${DB_PORT:${MYSQLPORT:3306}}/${DB_NAME:${MYSQLDATABASE:dbgestor}}?allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:Rosa2610*}}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ==========================================
# Configuración de HikariCP (Pool de Conexiones)
# ==========================================
# Evita que el backend aborte si MySQL tarda en despertar al iniciar
spring.datasource.hikari.initialization-fail-timeout=-1

# Renueva conexiones antes de que la nube las corte por inactividad (4 min y 1 min)
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# ==========================================
# Configuración JPA / Hibernate
# ==========================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update